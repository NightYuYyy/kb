name: docker

on:
  push:
    branches: [master]
    tags: ["v*"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4


      - name: Compute version
        id: version
        run: |
          DESC=$(git describe --tags --match 'v*' --always --dirty 2>/dev/null)
          if echo "$DESC" | grep -qE '^v[0-9]'; then
            # 有版本 tag：v1.0.1 或 v1.0.1-3-gxxxx → 取 1.0.1
            APP_VERSION=$(echo "$DESC" | sed 's/^v//' | sed 's/-.*//')
          else
            APP_VERSION="0.0.0-dev"
          fi
          echo "app_version=$APP_VERSION" >> $GITHUB_OUTPUT
          echo "commit=${{ github.sha }}" >> $GITHUB_OUTPUT
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            APP_VERSION=${{ steps.version.outputs.app_version }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            IMAGE=ghcr.io/${{ github.repository }}:latest
            IMAGE=$(echo "$IMAGE" | tr '[:upper:]' '[:lower:]')
            docker pull "$IMAGE"
            docker stop kb && docker rm kb
            docker run -d --name kb -p 8765:8765 \
              -v /home/arch/kb/data:/app/data \
              --restart unless-stopped \
              "$IMAGE"
